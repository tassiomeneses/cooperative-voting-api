springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health}

security:
  api-key:
    enabled: ${API_KEY_ENABLED:true}
    header-name: ${API_KEY_HEADER_NAME:X-API-Key}
    value: ${API_KEY_VALUE:}
  identity-hash:
    pepper: ${IDENTITY_HASH_PEPPER:}
    require-custom-pepper: ${IDENTITY_HASH_REQUIRE_CUSTOM_PEPPER:true}
